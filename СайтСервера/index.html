<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TOP VANILA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
}

.hero{
    height:100vh;
    background:
    linear-gradient(
        rgba(255,140,0,0.7),
        rgba(255,140,0,0.7)
    ),
    url("https://images.unsplash.com/photo-1511512578047-dfb367046420");

    background-size:cover;
    background-position:center;

    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:100px;
}

.left h1{
    font-size:80px;
    margin-bottom:20px;
}

.left p{
    font-size:30px;
}

.card{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    width:350px;
}

.ip{
    background:#eee;
    padding:10px;
    border-radius:10px;
    margin-top:15px;
}
</style>

</head>

<body>

<section class="hero">

<div class="left">
    <h1>Top Vanila</h1>
    <p>Начало новой эры</p>
</div>

<div class="card">
    <h2>Наш сервер</h2>

    <p id="online">Онлайн: загрузка...</p>

    <div class="ip">
        top_vanila.aternos.me
    </div>

</div>

</section>

<script>
fetch("https://api.mcstatus.io/v2/status/java/top_vanila.aternos.me")
.then(res => res.json())
.then(data => {
    document.getElementById("online").innerText =
    data.online ? "Онлайн: " + data.players.online : "Оффлайн";
})
.catch(() => {
    document.getElementById("online").innerText =
    "Ошибка проверки";
});
</script>

</body>
</html>
